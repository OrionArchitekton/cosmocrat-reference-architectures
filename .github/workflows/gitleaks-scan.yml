name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every commit of the range with gitleaks 8.24.3
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SCAN_PUSH_BEFORE: ${{ github.event.before }}
          SCAN_PUSH_AFTER: ${{ github.event.after }}
        run: python3 -I .github/scripts/gitleaks_scan.py
